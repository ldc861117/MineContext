#
# MineContext Configuration Template: Doubao (火山引擎豆包)
# 
# This template is configured for using Volcengine Doubao models.
# Copy this file to config/user/config.yaml and set API key in .env file.
#
# Prerequisites:
#   - Volcengine Doubao API key
#   - Set environment variable: LLM_API_KEY=your-doubao-api-key in .env file
#
# Setup Steps:
#   1. cp config/templates/doubao.yaml config/user/config.yaml
#   2. echo "LLM_API_KEY=your-doubao-api-key" > .env
#   3. python -m opencontext

# ============================================
# Vision Language Model (VLM) Configuration
# ============================================
vlm_model:
  provider: "doubao"
  model: "doubao-seed-1-6-flash-250828"  # Latest recommended model
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${LLM_API_KEY}"  # From environment variable
  temperature: 0.7
  max_tokens: 4096

# ============================================
# Embedding Model Configuration
# CRITICAL: dimensions must match your embedding model!
# ============================================
embedding_model:
  provider: "doubao"
  model: "doubao-embedding"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${LLM_API_KEY}"  # From environment variable
  
  # Doubao embedding dimensions
  dimensions: 1024  # Doubao embedding default
  output_dim: 1024

# ============================================
# Context Capture (Optional)
# ============================================
capture:
  screenshot:
    enabled: false  # Disable by default
  file_monitor:
    enabled: false

# ============================================
# Preferences
# ============================================
preferences:
  language: "zh"  # 推荐中文 / Recommend Chinese
  theme: "light"  # or "dark"

# ============================================
# Doubao 模型信息 / Doubao Model Information
# ============================================
#
# 视觉语言模型 (VLM) / Vision Language Models:
#   - doubao-seed-1-6-flash-250828 (最新推荐 / Latest recommended)
#   - doubao-seed-1-6-pro-250828 (更好的质量 / Better quality)
#
# 嵌入模型和维度 / Embedding Models and Dimensions:
#   - doubao-embedding: dimensions=1024
#
# 获取API密钥 / Get API Key:
#   访问 https://console.volcengine.com/
