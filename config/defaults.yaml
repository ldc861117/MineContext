#
# MineContext Default System Configuration
# This file contains system-level defaults and should NOT be modified by users.
# Users should create config/user/config.yaml to override specific settings.
#
# DO NOT EDIT THIS FILE unless you are updating system defaults in the codebase!

# Global settings
enabled: true

# ============================================
# System Paths and Storage
# ============================================
context_path: "."
user_setting_path: "${CONTEXT_PATH:.}/config/user/settings.yaml"

# ============================================
# Logging Configuration
# ============================================
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_path: "${CONTEXT_PATH:.}/logs/opencontext.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# ============================================
# Web Server Configuration (System Level)
# ============================================
web:
  host: 127.0.0.1
  port: 1733
  debug: false
  cors_origins:
    - "http://127.0.0.1:1733"
    - "http://localhost:1733"

# ============================================
# Database Configuration (System Level)
# ============================================
database:
  engine: sqlite
  path: "${CONTEXT_PATH:.}/data/opencontext.db"

# ============================================
# Storage Backend (System Level)
# ============================================
storage:
  backend: chromadb  # Options: chromadb, sqlite
  enabled: true
  base_path: "${CONTEXT_PATH:.}/data/storage"
  persist: true

# ============================================
# Document Processing Configuration
# ============================================
document_processing:
  enabled: true
  batch_size: 3  # Number of images processed by VLM at once (recommended 2-5)
  max_image_size: 1024  # Maximum image size (pixels)
  dpi: 200  # DPI for converting PDF to images

  # Page-by-page detection configuration
  text_threshold_per_page: 50  # Pages with fewer characters are considered scanned

# ============================================
# LLM Configuration (VLM - Vision Language Model)
# USER SHOULD OVERRIDE THESE IN config/user/config.yaml
# ============================================
vlm_model:
  enabled: true
  # User should set these in config/user/config.yaml:
  # provider: "ollama"  # or openai, doubao, localai, llamacpp, custom
  # model: "qwen2.5:14b"
  # base_url: "http://localhost:11434/v1"
  # api_key: ""  # Leave empty for local providers
  
  # Optional parameters
  temperature: 0.7
  max_tokens: 4096

# ============================================
# Embedding Model Configuration
# USER SHOULD OVERRIDE THESE IN config/user/config.yaml
# CRITICAL: dimensions parameter must be set correctly!
# ============================================
embedding_model:
  enabled: true
  # User should set these in config/user/config.yaml:
  # provider: "ollama"  # or openai, doubao, localai, llamacpp, custom
  # model: "nomic-embed-text"
  # base_url: "http://localhost:11434/v1"
  # api_key: ""  # Leave empty for local providers
  
  # CRITICAL PARAMETER: embedding dimensions must match the model!
  # This is crucial for vector database operations
  # Common values:
  #   - Ollama nomic-embed-text: 768
  #   - Ollama mxbai-embed-large: 1024
  #   - Ollama bge-m3: 1024
  #   - OpenAI text-embedding-3-small: 1536
  #   - OpenAI text-embedding-3-large: 3072
  # dimensions: 768  # User MUST set this!
  
  output_dim: 768  # Default, user should override based on their model

# ============================================
# Context Capture Configuration
# ============================================
capture:
  enabled: true
  
  # Screenshot capture
  screenshot:
    enabled: false  # Default disabled, user can enable
    capture_interval: 5  # seconds
    storage_path: "${CONTEXT_PATH:.}/screenshots"
  
  # File monitoring
  file_monitor:
    enabled: false  # Default disabled, user can enable
    recursive: true
    initial_scan: true
    monitor_paths: "./doc"
    capture_interval: 30  # seconds
    ignore_patterns:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/.venv/**"
      - "**/venv/**"
  
  # Vault document monitoring
  vault_document_monitor:
    enabled: false  # Default disabled
    monitor_interval: 30
    initial_scan: true

# ============================================
# Context Processing Configuration
# ============================================
processing:
  enabled: true  # Core functionality, must not be disabled
  
  document_processor:
    enabled: true
    batch_size: 5
    batch_timeout: 30
  
  screenshot_processor:
    enabled: true
    batch_size: 10
    batch_timeout: 60

# ============================================
# Context Consumption Configuration
# ============================================
consumption:
  enabled: true
  
  generation:
    enabled: true
    report_generation:
      enabled: true
      schedule: "0 18 * * *"  # 6 PM daily
  
  monitoring:
    enabled: true
    update_interval: 60  # seconds

# ============================================
# Prompts Configuration
# ============================================
prompts:
  language: "zh"  # Options: "zh" (Chinese), "en" (English)
  path: "${CONTEXT_PATH:.}/config"
  user_prompts_path: "${CONTEXT_PATH:.}/config/user/prompts"

# ============================================
# Feature Flags (System Level)
# ============================================
features:
  screen_recording: true
  document_processing: true
  todo_deduplication: true
  smart_suggestions: true
  real_time_monitoring: true

# ============================================
# Performance Configuration
# ============================================
performance:
  max_workers: 4
  timeout: 300  # seconds
  retry_attempts: 3
  retry_delay: 1  # seconds

# ============================================
# Security Configuration
# ============================================
security:
  enable_api_key_auth: false
  api_key: null  # Can be set via environment variable
  allowed_origins:
    - "http://127.0.0.1:1733"
    - "http://localhost:1733"
